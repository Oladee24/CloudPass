services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: local-docker-secret-change-before-production
      DATABASE_URL: postgresql://postgres:postgres@db:5432/cloudpass_db
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: cloudpass_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
