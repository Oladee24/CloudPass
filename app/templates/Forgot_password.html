{% extends "base.html" %}

{% block title %}Forgot Password - CloudPass{% endblock %}

{% block content %}
<section class="form-shell">
    <h1>Forgot your password?</h1>
    <p class="lead">Enter the email on your account and we'll send a link to reset your password. The link expires in 30 minutes.</p>
    <form method="post" class="form-card">
        <label>
            Email
            <input type="email" name="email" required>
        </label>
        <button type="submit" class="button">Send Reset Link</button>
    </form>
    <p><a href="{{ url_for('main.login') }}">Back to login</a></p>
</section>
{% endblock %}
